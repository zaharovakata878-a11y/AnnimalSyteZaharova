<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Головна - Цікаві факти про тварин</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Навігаційне меню між сторінками -->
    <nav>
        <a href="index.html">Головна</a>
        <a href="facts.html">Факти</a>
        <a href="gallery.html">Галерея</a>
    </nav>

    <div class="animal">🐘</div>

    <h1>Цікаві факти про тварин</h1>
    
    <div class="fact-box">
        <p style="font-size: 18px; line-height: 1.6;">
            На цьому сайті ви дізнаєтеся багато цікавого про дивовижний світ тварин. 
            Тварини населяють усі континенти нашої планети та мають неймовірні здібності.
        </p>
        <button onclick="generateRandomFact()">Показати цікавий факт</button>
        <div id="random-fact-display">Натисніть кнопку, щоб дізнатися факт! 😉</div>
    </div>

    <script>
        const animalFacts = [
            "Восьминіг має три серця.", "Коала спить до 20 годин на добу.", "Гепард розганяється до 110 км/год.",
            "Слони впізнають себе у дзеркалі.", "Жираф має сім шийних хребців.", "Полярні ведмеді мають чорну шкіру.",
            "Kенгуру не можуть рухатися назад.", "Сова повертає голову на 270°.", "Бджоли спілкуються танцями.",
            "Равлик має тисячі зубів.", "Пінгвіни можуть пірнати на сотні метрів.", "Тигри мають унікальний малюнок смуг.",
            "Верблюди можуть довго обходитися без води.", "Летючі миші — єдині ссавці, які літають.", "Папуги можуть запам'ятовувати слова.",
            "Крокодили живуть на Землі понад 200 мільйонів років.", "Мурахи можуть переносити вагу, більшу за власну у багато разів.",
            "Язик синього кита важить приблизно як слон.", "Дельфіни мають власні «імена».", "Деякі жаби можуть змінювати колір шкіри."
        ];

        function generateRandomFact() {
            const randomIndex = Math.floor(Math.random() * animalFacts.length);
            document.getElementById('random-fact-display').innerText = animalFacts[randomIndex];
        }
    </script>
</body>
</html>
